<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="SK Mobiles - Tempered Glass & Inventory Master" />
    <meta name="application-name" content="SK Mobiles" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SK Mobiles" />

    <title>SK Mobiles - Inventory Master</title>

    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="shortcut icon" type="image/png" href="logo.png" />
    <link rel="apple-touch-icon" type="image/png" href="logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>

    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>

  <body>
    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
      Action completed
    </div>

    <!-- AUTH GATE / LOGIN MODAL -->
    <div id="authGate" class="auth-gate" role="dialog" aria-modal="true" aria-labelledby="authTitle">
      <div class="auth-card">
        <img src="logo.png" alt="SK Mobiles" class="auth-logo" />
        <h1 id="authTitle" class="auth-title">SK MOBILES</h1>
        <p id="authSubtitle" class="auth-subtitle">Enter credentials to proceed</p>

        <!-- LOGIN STEP 1: EMAIL & PASSWORD -->
        <div id="loginStep1" class="auth-panel" data-step="email-password">
          <div class="form-group">
            <label for="emailInput" class="form-label">Gmail / Email Address</label>
            <input
              id="emailInput"
              class="form-input"
              type="email"
              placeholder="example@gmail.com"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label for="passwordInput" class="form-label">Password</label>
            <input
              id="passwordInput"
              class="form-input"
              type="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            />
          </div>

          <button id="loginBtn" class="form-button" type="button">🔐 Verify & Login</button>
        </div>

        <!-- LOGIN STEP 2: SET PIN -->
        <div id="loginStep2" class="auth-panel" data-step="set-pin" style="display: none">
          <div class="auth-banner">
            🔒 Set a 4-digit security PIN. After this, only this PIN is required to unlock the app!
          </div>

          <div class="form-group">
            <label for="pinInput1" class="form-label">Enter New 4-Digit PIN</label>
            <input
              id="pinInput1"
              class="form-input form-input-pin"
              type="password"
              inputmode="numeric"
              maxlength="4"
              placeholder="••••"
              required
            />
          </div>

          <div class="form-group">
            <label for="pinInput2" class="form-label">Confirm 4-Digit PIN</label>
            <input
              id="pinInput2"
              class="form-input form-input-pin"
              type="password"
              inputmode="numeric"
              maxlength="4"
              placeholder="••••"
              required
            />
          </div>

          <button id="savePinBtn" class="form-button form-button-success" type="button">
            💾 Set PIN & Restart App
          </button>
        </div>

        <!-- LOGIN STEP 3: PIN ONLY -->
        <div id="loginStep3" class="auth-panel" data-step="pin-only" style="display: none">
          <div class="form-group">
            <label for="pinInputQuick" class="form-label form-label-center">Enter 4-Digit Security PIN</label>
            <input
              id="pinInputQuick"
              class="form-input form-input-pin"
              type="password"
              inputmode="numeric"
              maxlength="4"
              placeholder="••••"
              autofocus
              required
            />
          </div>

          <button id="unlockBtn" class="form-button" type="button">🔓 Unlock App</button>

          <button id="resetPinBtn" class="form-button-text" type="button">
            Forgot PIN? Login with Gmail
          </button>
        </div>

        <div id="authMessage" class="auth-message" role="alert" aria-live="assertive"></div>
      </div>
    </div>

    <!-- MAIN APP SHELL -->
    <div id="appShell" class="app-shell" style="display: none">
      <!-- HEADER -->
      <header class="app-header">
        <div class="header-content">
          <div class="logo-section">
            <img src="logo.png" alt="SK Mobiles" class="logo-image" />
            <div>
              <h1 class="app-title">SK MOBILES</h1>
              <p class="app-subtitle">Tempered Glass & Inventory Master</p>
            </div>
          </div>

          <button id="themeToggle" class="theme-toggle-btn" type="button" aria-label="Open theme menu">
            🎨
          </button>
        </div>
      </header>

      <!-- MAIN CONTENT -->
      <main class="content-area">
        <section class="hero-section">
          <div class="hero-icon">📱</div>
          <h2>SK Mobiles App</h2>
          <p>Secure PIN login configured successfully.</p>
        </section>

        <section class="inventory-section">
          <div class="section-header">
            <h3>Inventory</h3>
            <button id="addItemBtn" class="btn-secondary" type="button">+ Add Item</button>
          </div>
          <div id="inventoryContainer" class="inventory-grid" role="list"></div>
        </section>
      </main>

      <!-- BOTTOM NAVIGATION -->
      <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item active" type="button" data-nav="home">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" type="button" data-nav="inventory">
          <span class="nav-icon">📦</span>
          <span class="nav-label">Inventory</span>
        </button>
        <button class="nav-item" type="button" data-nav="orders">
          <span class="nav-icon">📋</span>
          <span class="nav-label">Orders</span>
        </button>
        <button class="nav-item" type="button" data-nav="settings">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">Settings</span>
        </button>
      </nav>
    </div>

    <!-- THEME MODAL -->
    <dialog id="themeModal" class="modal" aria-labelledby="themeTitle">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="themeTitle">Select Theme</h2>
          <button class="modal-close" type="button" aria-label="Close theme menu">✕</button>
        </div>

        <div class="theme-grid">
          <button class="theme-option" type="button" data-theme="light">🛡️ Classic Blue</button>
          <button class="theme-option" type="button" data-theme="ocean">🌊 Ocean</button>
          <button class="theme-option" type="button" data-theme="royal">🔮 Royal</button>
          <button class="theme-option" type="button" data-theme="sunset">🌅 Sunset</button>
          <button class="theme-option" type="button" data-theme="emerald">🍃 Emerald</button>
          <button class="theme-option" type="button" data-theme="rose">🌹 Rose</button>
          <button class="theme-option" type="button" data-theme="midnight">🌌 Midnight</button>
          <button class="theme-option" type="button" data-theme="dark">🌙 Dark</button>
        </div>
      </div>
    </dialog>
  </body>
</html>
