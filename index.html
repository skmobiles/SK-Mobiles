<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <title>SK MOBILES 2.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <div class="brand-mark">SK</div>
        <div><strong>SK MOBILES</strong><span>2.0</span></div>
      </div>
      <nav id="sideNav"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
          <div>
            <div class="eyebrow">WELCOME BACK</div>
            <h1 id="pageTitle">Home</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="wallet-badge" type="button">₹ <span id="walletValue">0.00</span></button>
          <button class="avatar" type="button">SK</button>
        </div>
      </header>

      <section id="pageContent" class="page-content"></section>
    </main>

    <nav id="bottomNav" class="bottom-nav" aria-label="Mobile navigation"></nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
